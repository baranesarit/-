<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8">
<style>
@font-face{font-family:Suez;src:url(node_modules/@fontsource/suez-one/files/suez-one-hebrew-400-normal.woff2)}
@font-face{font-family:Heebo;font-weight:400;src:url(node_modules/@fontsource/heebo/files/heebo-hebrew-400-normal.woff2)}
@font-face{font-family:Heebo;font-weight:800;src:url(node_modules/@fontsource/heebo/files/heebo-hebrew-800-normal.woff2)}
@font-face{font-family:HeeboL;font-weight:800;src:url(node_modules/@fontsource/heebo/files/heebo-latin-800-normal.woff2)}
@font-face{font-family:HeeboL;font-weight:400;src:url(node_modules/@fontsource/heebo/files/heebo-latin-400-normal.woff2)}
html,body{margin:0;background:#000}
canvas{display:block}
</style></head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
const W=1080,H=1920,TOTAL=50;
const c=document.getElementById('c'),x=c.getContext('2d');
// ---------- utils ----------
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const ease=t=>{t=clamp(t);return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2};
const eOut=t=>1-Math.pow(1-clamp(t),3);
const back=t=>{t=clamp(t);const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)};
const prog=(t,a,b)=>clamp((t-a)/(b-a));
const F=(w,s,fam)=>`${w} ${s}px ${fam||'Heebo, HeeboL'}`;

// ---------- static layers ----------
const R=rng(7);
const stars=[...Array(220)].map(()=>({x:R()*W,y:R()*H*0.75,r:R()*2.2+.4,p:R()*6.28,s:R()*2+1}));
const dust=[...Array(140)].map(()=>({x:R()*W,y:R()*H,r:R()*3+1,p:R()*6.28,v:R()*20+8}));
// bookshelf canvas
const shelf=document.createElement('canvas');shelf.width=W;shelf.height=H;
(function(){const s=shelf.getContext('2d');const r=rng(42);
  const wood=s.createLinearGradient(0,0,W,0);wood.addColorStop(0,'#2a160c');wood.addColorStop(.5,'#4a2a16');wood.addColorStop(1,'#2a160c');
  s.fillStyle='#160c06';s.fillRect(0,0,W,H);
  const cols=['#7a1f2b','#1f4e79','#2d6a3e','#8a6a1d','#5b2a6e','#a0522d','#234','#6b1d1d','#1d5b5b','#c49a3a','#3b2f6b'];
  for(let row=0;row<7;row++){const top=60+row*270,bottom=top+230;
    let px=30;while(px<W-40){const bw=22+r()*36,bh=150+r()*75;if(px+bw>W-30)break;
      const col=cols[Math.floor(r()*cols.length)];
      if(r()<.12){ // leaning book
        s.save();s.translate(px,bottom);s.rotate(-.18);s.fillStyle=col;s.fillRect(0,-bh,bw,bh);s.restore();px+=bw+14;continue;}
      s.fillStyle=col;s.fillRect(px,bottom-bh,bw,bh);
      s.fillStyle='rgba(255,215,120,.55)';s.fillRect(px+3,bottom-bh+18,bw-6,3);s.fillRect(px+3,bottom-26,bw-6,3);
      s.fillStyle='rgba(0,0,0,.25)';s.fillRect(px+bw-4,bottom-bh,4,bh);
      px+=bw+2;}
    s.fillStyle=wood;s.fillRect(0,bottom,W,32);s.fillStyle='rgba(0,0,0,.5)';s.fillRect(0,bottom+32,W,10);
  }
  s.fillStyle=wood;s.fillRect(0,0,26,H);s.fillRect(W-26,0,26,H);
})();
const dark=document.createElement('canvas');dark.width=W;dark.height=H;const dx=dark.getContext('2d');

// ---------- drawing helpers ----------
function sky(t,alpha=1){x.save();x.globalAlpha=alpha;
  const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#05031a');g.addColorStop(.55,'#1b0e45');g.addColorStop(1,'#3a1650');x.fillStyle=g;x.fillRect(0,0,W,H);
  for(const s of stars){const a=.35+.65*Math.abs(Math.sin(t*s.s+s.p));x.fillStyle=`rgba(255,250,220,${a})`;x.beginPath();x.arc(s.x,s.y,s.r,0,7);x.fill();}
  x.restore();}
function moon(cx,cy,r,t){x.save();const g=x.createRadialGradient(cx,cy,r*.5,cx,cy,r*3.2);g.addColorStop(0,'rgba(255,240,190,.45)');g.addColorStop(1,'rgba(255,240,190,0)');x.fillStyle=g;x.beginPath();x.arc(cx,cy,r*3.2,0,7);x.fill();
  x.fillStyle='#fff3c8';x.beginPath();x.arc(cx,cy,r,0,7);x.fill();x.globalCompositeOperation='source-atop';x.fillStyle='rgba(200,180,130,.35)';
  [[.3,-.2,.18],[-.25,.3,.12],[-.1,-.4,.1],[.35,.35,.08]].forEach(([a,b,s])=>{x.beginPath();x.arc(cx+a*r,cy+b*r,s*r,0,7);x.fill()});x.restore();}
function sparkles(t,cx,cy,n,spread,seed,col='255,220,120',life=2.2){const r=rng(seed);x.save();x.globalCompositeOperation='lighter';
  for(let i=0;i<n;i++){const off=r()*life,ang=r()*6.28,sp=r()*spread,lt=((t+off)%life)/life;
    const px=cx+Math.cos(ang)*sp*lt+Math.sin(t*2+i)*10,py=cy+Math.sin(ang)*sp*lt-lt*120;const a=Math.sin(lt*Math.PI);const sz=(r()*5+2)*(1-lt*.5);
    star4(px,py,sz*2.2,`rgba(${col},${a})`);}
  x.restore();}
function star4(px,py,s,col){x.fillStyle=col;x.beginPath();x.moveTo(px,py-s);x.quadraticCurveTo(px,py,px+s,py);x.quadraticCurveTo(px,py,px,py+s);x.quadraticCurveTo(px,py,px-s,py);x.quadraticCurveTo(px,py,px,py-s);x.fill();}
function floatDust(t,a=1){x.save();x.globalCompositeOperation='lighter';for(const d of dust){const py=(d.y-t*d.v+H*10)%H;const px=d.x+Math.sin(t*.7+d.p)*30;x.fillStyle=`rgba(255,210,140,${a*(.15+.25*Math.sin(t+d.p)**2)})`;x.beginPath();x.arc(px,py,d.r,0,7);x.fill();}x.restore();}
function text(str,px,py,size,{font='Heebo, HeeboL',w=800,col='#fff',glow='rgba(255,200,90,.9)',blur=30,a=1,sc=1,stroke=null,grad=null,dir='rtl'}={}){
  if(a<=0)return;x.save();x.globalAlpha=clamp(a);x.translate(px,py);x.scale(sc,sc);x.direction=dir;x.textAlign='center';x.textBaseline='middle';x.font=F(w,size,font);
  if(glow){x.shadowColor=glow;x.shadowBlur=blur;}
  if(grad){const g=x.createLinearGradient(0,-size/2,0,size/2);grad.forEach((cl,i)=>g.addColorStop(i/(grad.length-1),cl));x.fillStyle=g;}else x.fillStyle=col;
  if(stroke){x.lineWidth=stroke[1];x.strokeStyle=stroke[0];x.lineJoin='round';x.strokeText(str,0,0);}
  x.fillText(str,0,0);x.shadowBlur=0;x.fillText(str,0,0);x.restore();}
// reveal text letter-ish: fade + rise
function revealText(str,px,py,size,t,t0,opt={}){const p=eOut(prog(t,t0,t0+.8));text(str,px,py+(1-p)*40,size,{...opt,a:p*(opt.a??1)});}
function vignette(s=.75){const g=x.createRadialGradient(W/2,H/2,H*.25,W/2,H/2,H*.75);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,`rgba(0,0,0,${s})`);x.fillStyle=g;x.fillRect(0,0,W,H);}
function shelves(t,beams,amb=.9,zoom=1){x.save();x.translate(W/2,H/2);x.scale(zoom,zoom);x.translate(-W/2,-H/2);x.drawImage(shelf,0,0);x.restore();
  dx.globalCompositeOperation='source-over';dx.clearRect(0,0,W,H);dx.fillStyle=`rgba(4,2,14,${amb})`;dx.fillRect(0,0,W,H);dx.globalCompositeOperation='destination-out';
  for(const [bx,by,br,ba] of beams){const g=dx.createRadialGradient(bx,by,0,bx,by,br);g.addColorStop(0,`rgba(0,0,0,${ba})`);g.addColorStop(.6,`rgba(0,0,0,${ba*.6})`);g.addColorStop(1,'rgba(0,0,0,0)');dx.fillStyle=g;dx.beginPath();dx.arc(bx,by,br,0,7);dx.fill();}
  x.drawImage(dark,0,0);
  x.save();x.globalCompositeOperation='lighter';for(const [bx,by,br,ba] of beams){const g=x.createRadialGradient(bx,by,0,bx,by,br);g.addColorStop(0,`rgba(255,220,150,${.18*ba})`);g.addColorStop(1,'rgba(255,220,150,0)');x.fillStyle=g;x.beginPath();x.arc(bx,by,br,0,7);x.fill();}x.restore();}
function flyingBook(px,py,s,flap,col,rot=0){x.save();x.translate(px,py);x.rotate(rot);x.scale(s,s);const f=Math.sin(flap)*.9;
  x.shadowColor='rgba(255,210,120,.8)';x.shadowBlur=25;
  // pages
  x.fillStyle='#f6ecd2';x.beginPath();x.moveTo(0,0);x.lineTo(-70,-20*f-10);x.lineTo(-70,40-20*f);x.lineTo(0,50);x.closePath();x.fill();
  x.beginPath();x.moveTo(0,0);x.lineTo(70,-20*f-10);x.lineTo(70,40-20*f);x.lineTo(0,50);x.closePath();x.fill();
  x.shadowBlur=0;x.fillStyle=col;x.beginPath();x.moveTo(0,-4);x.lineTo(-76,-24*f-14);x.lineTo(-78,-20*f-6);x.lineTo(0,2);x.fill();x.beginPath();x.moveTo(0,-4);x.lineTo(76,-24*f-14);x.lineTo(78,-20*f-6);x.lineTo(0,2);x.fill();
  x.strokeStyle='rgba(120,90,50,.5)';x.lineWidth=2;for(let i=1;i<4;i++){x.beginPath();x.moveTo(-10,8+i*9);x.lineTo(-60,i*9-10*f);x.stroke();x.beginPath();x.moveTo(10,8+i*9);x.lineTo(60,i*9-10*f);x.stroke();}
  x.restore();}
function figure(cx,cy,s,t,a){ // hooded shadow thief
  x.save();x.globalAlpha=a;x.translate(cx,cy);x.scale(s,s);
  const g=x.createRadialGradient(0,-40,10,0,0,420);g.addColorStop(0,'rgba(120,40,200,.45)');g.addColorStop(1,'rgba(120,40,200,0)');x.fillStyle=g;x.beginPath();x.arc(0,0,420,0,7);x.fill();
  x.fillStyle='#07040f';x.beginPath();x.moveTo(0,-330);
  x.bezierCurveTo(120,-330,150,-200,140,-110);x.bezierCurveTo(230,-60,260,120,250,330);
  for(let i=0;i<=8;i++){const xx=250-i*62.5;x.lineTo(xx,330+Math.sin(t*4+i)*22+(i%2?28:0));}
  x.bezierCurveTo(-260,120,-230,-60,-140,-110);x.bezierCurveTo(-150,-200,-120,-330,0,-330);x.fill();
  // hood opening
  x.fillStyle='#000';x.beginPath();x.ellipse(0,-170,78,95,0,0,7);x.fill();
  const blink=(Math.sin(t*1.3)>.97)?.1:1;
  x.shadowColor='#ffd23a';x.shadowBlur=40;x.fillStyle='#ffe066';
  x.beginPath();x.ellipse(-30,-180,18,9*blink,.15,0,7);x.fill();x.beginPath();x.ellipse(30,-180,18,9*blink,-.15,0,7);x.fill();
  x.restore();}
function page(px,py,rot,s,a){x.save();x.globalAlpha=a;x.translate(px,py);x.rotate(rot);x.scale(s,s);x.shadowColor='rgba(255,200,100,.9)';x.shadowBlur=20;x.fillStyle='#f3e6c4';x.fillRect(-45,-60,90,120);x.shadowBlur=0;
  x.fillStyle='rgba(90,60,30,.35)';for(let i=0;i<5;i++)x.fillRect(-32,-45+i*14,64,4);x.direction='rtl';x.textAlign='center';x.font=F(400,30,'Suez');x.fillStyle='#5a1e1e';x.fillText('סוף',0,40);x.restore();}
function clockFace(cx,cy,r,t,ang){x.save();x.translate(cx,cy);
  x.shadowColor='rgba(255,200,90,.8)';x.shadowBlur=40;x.fillStyle='#1c1230';x.beginPath();x.arc(0,0,r,0,7);x.fill();x.shadowBlur=0;
  x.lineWidth=10;x.strokeStyle='#d9a93c';x.stroke();x.fillStyle='#d9a93c';
  for(let i=0;i<12;i++){x.save();x.rotate(i*Math.PI/6);x.fillRect(-4,-r+18,8,i%3?18:32);x.restore();}
  x.lineCap='round';x.strokeStyle='#ffe2a0';x.lineWidth=12;x.save();x.rotate(ang*.08);x.beginPath();x.moveTo(0,0);x.lineTo(0,-r*.5);x.stroke();x.restore();
  x.lineWidth=7;x.save();x.rotate(ang);x.beginPath();x.moveTo(0,0);x.lineTo(0,-r*.78);x.stroke();x.restore();
  x.fillStyle='#ffe2a0';x.beginPath();x.arc(0,0,14,0,7);x.fill();x.restore();}
function libraryBuilding(cx,by,t){x.save();x.fillStyle='#0a0618';
  x.beginPath();x.moveTo(cx-380,by);x.lineTo(cx-380,by-420);x.lineTo(cx,by-640);x.lineTo(cx+380,by-420);x.lineTo(cx+380,by);x.fill();
  x.fillRect(cx-420,by-440,840,30);
  for(let i=-3;i<=3;i++){x.fillStyle='#120b26';x.fillRect(cx+i*100-22,by-400,44,400);}
  // lit round window
  const fl=.75+.25*Math.sin(t*9)*Math.sin(t*3.3);x.shadowColor='rgba(255,190,80,1)';x.shadowBlur=60*fl;x.fillStyle=`rgba(255,200,100,${fl})`;x.beginPath();x.arc(cx,by-510,60,0,7);x.fill();
  x.shadowBlur=0;x.strokeStyle='#0a0618';x.lineWidth=8;x.beginPath();x.moveTo(cx-60,by-510);x.lineTo(cx+60,by-510);x.moveTo(cx,by-570);x.lineTo(cx,by-450);x.stroke();
  x.fillStyle='rgba(255,200,100,.85)';x.shadowColor='rgba(255,190,80,1)';x.shadowBlur=30;x.fillRect(cx-55,by-210,110,210);
  x.restore();
  x.fillStyle='#04020c';x.fillRect(0,by,W,H-by);}
function iconCard(cx,cy,w,h,a,sc,title,drawIcon,t){if(a<=0)return;x.save();x.globalAlpha=a;x.translate(cx,cy);x.scale(sc,sc);
  x.shadowColor='rgba(255,200,90,.6)';x.shadowBlur=40;const g=x.createLinearGradient(0,-h/2,0,h/2);g.addColorStop(0,'rgba(60,30,110,.92)');g.addColorStop(1,'rgba(25,12,55,.92)');x.fillStyle=g;
  x.beginPath();x.roundRect(-w/2,-h/2,w,h,36);x.fill();x.shadowBlur=0;x.lineWidth=4;x.strokeStyle='rgba(255,210,120,.85)';x.stroke();
  x.save();x.translate(w/2-110,0);drawIcon(t);x.restore();
  x.direction='rtl';x.textAlign='right';x.textBaseline='middle';x.font=F(800,64);x.fillStyle='#fff';x.fillText(title,w/2-210,4);x.restore();}
function icoMag(t){x.save();x.rotate(Math.sin(t*2)*.2);x.strokeStyle='#ffd36b';x.lineWidth=12;x.beginPath();x.arc(-8,-8,36,0,7);x.stroke();x.lineCap='round';x.lineWidth=16;x.beginPath();x.moveTo(18,18);x.lineTo(48,48);x.stroke();x.restore();}
function icoKey(t){x.save();x.rotate(-.6+Math.sin(t*2)*.15);x.fillStyle='#ffd36b';x.beginPath();x.arc(-30,0,26,0,7);x.fill();x.fillStyle='#2a1550';x.beginPath();x.arc(-30,0,10,0,7);x.fill();x.fillStyle='#ffd36b';x.fillRect(-6,-7,66,14);x.fillRect(38,0,10,24);x.fillRect(52,0,10,18);x.restore();}
function icoScroll(t){x.save();x.rotate(Math.sin(t*2)*.12);x.fillStyle='#f3e6c4';x.fillRect(-40,-44,80,88);x.fillStyle='#d9a93c';x.beginPath();x.ellipse(0,-46,48,12,0,0,7);x.fill();x.beginPath();x.ellipse(0,46,48,12,0,0,7);x.fill();
  x.fillStyle='#7a3a1a';x.font=F(400,22,'Suez');x.textAlign='center';x.direction='rtl';x.fillText('?!',0,-12);x.fillText('⁂',0,18);x.restore();}
function seal(cx,cy,r,t,sc,a){if(a<=0)return;x.save();x.globalAlpha=a;x.translate(cx,cy);x.scale(sc,sc);
  x.save();x.rotate(t*.25);x.fillStyle='#d4a017';x.shadowColor='rgba(255,210,80,.9)';x.shadowBlur=60;x.beginPath();
  for(let i=0;i<48;i++){const rr=i%2?r:r*1.09;const an=i*Math.PI/24;x.lineTo(Math.cos(an)*rr,Math.sin(an)*rr);}x.closePath();x.fill();x.restore();
  const g=x.createRadialGradient(-r*.3,-r*.3,10,0,0,r);g.addColorStop(0,'#fff1b0');g.addColorStop(.6,'#e8b730');g.addColorStop(1,'#a8770f');x.fillStyle=g;x.beginPath();x.arc(0,0,r*.9,0,7);x.fill();
  x.lineWidth=6;x.strokeStyle='#7a520a';x.beginPath();x.arc(0,0,r*.78,0,7);x.stroke();
  x.strokeStyle='#4a2f05';x.lineWidth=26;x.lineCap='round';x.lineJoin='round';x.beginPath();x.moveTo(-r*.32,-r*.12);x.lineTo(-r*.08,r*.14);x.lineTo(r*.38,-r*.36);x.stroke();
  x.direction='rtl';x.textAlign='center';x.textBaseline='middle';x.fillStyle='#4a2f05';x.font=F(800,r*.2);x.fillText('מאושר',0,r*.42);
  x.restore();}

// ---------- scenes ----------
const scenes=[
 [0,6.2,function(t,lt){ // outside library at night
   sky(t);moon(800,330,95,t);libraryBuilding(W/2,1560,t);floatDust(t,.6);
   sparkles(t,W/2,1050,26,260,3);
   revealText('ספרניות יקרות,',W/2,520,108,lt,.5,{font:'Suez',w:400,grad:['#fff6d6','#ffc94a']});
   revealText('מה קורה בספרייה...',W/2,1700,74,lt,2.0);
   revealText('כשכולם הולכים הביתה?',W/2,1800,74,lt,3.3,{col:'#ffd36b'});
 }],
 [6.2,12.4,function(t,lt){ // inside, midnight, flashlight
   const bx=W/2+Math.sin(lt*1.1)*330,by=1150+Math.cos(lt*.8)*260;
   shelves(t,[[bx,by,330,1],[W/2,400,240,.35]],.93,1+lt*.012);floatDust(t,.9);
   const sw=prog(lt,0,3.2);clockFace(W/2,400,175,t,-Math.PI*0.6*(1-eOut(sw)));
   if(lt>3.2&&lt<4.4){x.save();x.globalCompositeOperation='lighter';const p=prog(lt,3.2,4.4);x.strokeStyle=`rgba(255,220,140,${1-p})`;x.lineWidth=8;x.beginPath();x.arc(W/2,400,175+p*220,0,7);x.stroke();x.restore();}
   vignette(.6);
   revealText('חצות.',W/2,760,120,lt,.6,{font:'Suez',w:400,grad:['#fff','#ffcf5a']});
   revealText('הספרייה נעולה. האורות כבים.',W/2,880,64,lt,1.6);
   revealText('אבל משהו... זז בין המדפים',W/2,1660,72,lt,3.6,{col:'#ffd36b',glow:'rgba(160,80,255,.9)'});
 }],
 [12.4,18.6,function(t,lt){ // the thief
   shelves(t,[[W/2,900,520,.55]],.95);
   const ap=eOut(prog(lt,0,1.6));figure(W/2,1050,.7+ap*.5,t,ap);
   const r=rng(99);for(let i=0;i<14;i++){const st=.8+r()*3.6,p=prog(lt,st,st+1.6);if(p<=0||p>=1)continue;
     const sx=r()<.5?-60:W+60,sy=200+r()*1400;const ex=W/2+(r()-.5)*80,ey=900;const q=ease(p);
     page(sx+(ex-sx)*q,sy+(ey-sy)*q-Math.sin(q*Math.PI)*300,t*3+i,.9-q*.5,Math.sin(p*Math.PI)*1.2);}
   vignette(.7);
   revealText('דמות מסתורית משוטטת בלילה',W/2,260,70,lt,.8,{glow:'rgba(160,80,255,.9)'});
   revealText('וגונבת את כל',W/2,1640,84,lt,2.4,{font:'Suez',w:400});
   revealText('הסופים של הספרים!',W/2,1760,96,lt,3.0,{font:'Suez',w:400,grad:['#ffe9a8','#ff9f3a'],glow:'rgba(255,90,40,.9)'});
 }],
 [18.6,25.4,function(t,lt){ // title reveal
   sky(t);const fl=prog(lt,0,.5);if(fl<1){x.fillStyle=`rgba(255,240,200,${1-fl})`;x.fillRect(0,0,W,H);}
   sparkles(t,W/2,900,70,520,11);sparkles(t,W/2,900,40,380,12,'200,150,255');
   for(let i=0;i<5;i++){const a=i/5*6.28+t*.35;flyingBook(W/2+Math.cos(a)*360,980+Math.sin(a)*520,.9+.2*Math.sin(t+i),t*6+i,['#7a1f2b','#1f4e79','#2d6a3e','#5b2a6e','#8a6a1d'][i],Math.sin(t+i)*.2);}
   floatDust(t);
   const p=back(prog(lt,.3,1.3));
