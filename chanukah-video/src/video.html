<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8">
<style>
@font-face{font-family:Rubik;font-weight:900;src:url(fonts/pkg_fontsource-rubik-5.3.0/files/rubik-hebrew-900-normal.woff2);unicode-range:U+0590-05FF,U+FB1D-FB4F}
@font-face{font-family:Rubik;font-weight:400;src:url(fonts/pkg_fontsource-rubik-5.3.0/files/rubik-hebrew-400-normal.woff2)}
@font-face{font-family:Rubik;font-weight:800;src:url(fonts/pkg_fontsource-rubik-5.3.0/files/rubik-hebrew-800-normal.woff2);unicode-range:U+0590-05FF,U+FB1D-FB4F}
@font-face{font-family:Rubik;font-weight:900;src:url(fonts/lat/package/files/rubik-latin-900-normal.woff2);unicode-range:U+0000-00FF,U+2013-2014}
@font-face{font-family:Rubik;font-weight:800;src:url(fonts/lat/package/files/rubik-latin-800-normal.woff2);unicode-range:U+0000-00FF,U+2013-2014}
@font-face{font-family:Suez;src:url(fonts/pkg_fontsource-suez-one-5.3.0/files/suez-one-hebrew-400-normal.woff2)}
@font-face{font-family:Secular;src:url(fonts/pkg_fontsource-secular-one-5.3.0/files/secular-one-hebrew-400-normal.woff2)}
html,body{margin:0;background:#000}
canvas{display:block}
</style></head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
const W=1080,H=1920,BEAT=60/128,BAR=4*BEAT;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const logo=new Image();logo.src='assets/logo_new.png';
const C={navy:'#1c2350',cyan:'#29b6f6',orange:'#f7931e',red:'#d7263d',green:'#3cb54a',purple:'#9b27a8',gold:'#ffd34d'};

const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const P=(t,s,d)=>clamp((t-s)/d);
const E={
  out:x=>1-Math.pow(1-x,3),
  back:x=>{const c1=2.2,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)},
  el:x=>x<=0?0:x>=1?1:Math.pow(2,-10*x)*Math.sin((x*10-0.75)*(2*Math.PI/3))+1,
};
const rnd=i=>{const s=Math.sin(i*127.1+311.7)*43758.5453;return s-Math.floor(s)};
const S=[0,2*BAR,4*BAR,6*BAR,8*BAR,10*BAR,12*BAR,14*BAR,99]; const DUR=31.5;

function fit(txt,size,family,weight,maxW){
  ctx.font=`${weight} ${size}px ${family}`;
  const w=ctx.measureText(txt).width;
  if(w>maxW){size*=maxW/w;ctx.font=`${weight} ${size}px ${family}`}
  return size;
}

// Shiny gold title text with navy outline and glow
function gold(txt,x,y,size,o={}){
  const fam=o.family||'Rubik',wt=o.weight||900;
  size=fit(txt,size,fam,wt,o.maxW||980);
  ctx.save();ctx.translate(x,y);
  if(o.rot)ctx.rotate(o.rot);
  if(o.scale!=null)ctx.scale(o.scale,o.scale);
  ctx.globalAlpha=o.alpha??1;
  ctx.textAlign='center';ctx.textBaseline='middle';ctx.direction='rtl';ctx.lineJoin='round';
  ctx.shadowColor=o.glow||'rgba(255,160,0,.95)';ctx.shadowBlur=o.blur??45;
  ctx.lineWidth=size*.16;ctx.strokeStyle=o.stroke||'#1a1440';ctx.strokeText(txt,0,0);
  ctx.shadowBlur=0;
  let g;
  if(o.fill){g=o.fill}else{
    g=ctx.createLinearGradient(0,-size*.5,0,size*.5);
    g.addColorStop(0,'#fffbe0');g.addColorStop(.38,'#ffe066');g.addColorStop(.52,'#ffae00');g.addColorStop(1,'#ffdf6b');
  }
  ctx.fillStyle=g;ctx.fillText(txt,0,0);
  // moving shine
  if(!o.fill){
    const sx=((performanceT*700)%(size*12))-size*6;
    const sh=ctx.createLinearGradient(sx-size,0,sx+size,0);
    sh.addColorStop(0,'rgba(255,255,255,0)');sh.addColorStop(.5,'rgba(255,255,255,.55)');sh.addColorStop(1,'rgba(255,255,255,0)');
    ctx.globalCompositeOperation='source-atop';ctx.fillStyle=sh;ctx.fillText(txt,0,0);
  }
  ctx.restore();
}
function plain(txt,x,y,size,color,o={}){
  const fam=o.family||'Rubik',wt=o.weight||800;
  size=fit(txt,size,fam,wt,o.maxW||980);
  ctx.save();ctx.translate(x,y);if(o.scale!=null)ctx.scale(o.scale,o.scale);
  ctx.globalAlpha=o.alpha??1;
  ctx.textAlign='center';ctx.textBaseline='middle';ctx.direction=o.dir||'rtl';ctx.lineJoin='round';
  if(o.stroke){ctx.lineWidth=size*.14;ctx.strokeStyle=o.stroke;ctx.strokeText(txt,0,0)}
  if(o.glow){ctx.shadowColor=o.glow;ctx.shadowBlur=30}
  ctx.fillStyle=color;ctx.fillText(txt,0,0);ctx.restore();
}
function rrect(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}

let performanceT=0;

// ---------- backgrounds & particles ----------
function background(t,warm){
  const g=ctx.createRadialGradient(W/2,H*.42,40,W/2,H*.5,H*.85);
  if(warm){g.addColorStop(0,'#5a2a9a');g.addColorStop(.45,'#1d1a6a');g.addColorStop(1,'#07061f')}
  else{g.addColorStop(0,'#2a4bb8');g.addColorStop(.45,'#12206a');g.addColorStop(1,'#050925')}
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.save();ctx.translate(W/2,H*.42);ctx.rotate(t*.18);
  for(let i=0;i<18;i++){
    ctx.rotate(Math.PI*2/18);
    ctx.fillStyle=i%2?'rgba(255,200,80,.07)':'rgba(90,190,255,.05)';
    ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(-140,-2200);ctx.lineTo(140,-2200);ctx.fill();
  }
  ctx.restore();
  for(let i=0;i<140;i++){
    const x=rnd(i)*W,y=rnd(i+500)*H,a=.25+.75*Math.abs(Math.sin(t*2.5+i));
    ctx.fillStyle=`rgba(255,255,240,${a*.8})`;
    star6(x,y,1.5+rnd(i+9)*3.5*(i%7==0?2.5:1));
  }
}
function star6(x,y,r){ // small magen-david sparkle
  ctx.beginPath();
  for(const off of [0,Math.PI/3]){
    for(let k=0;k<3;k++){const a=off+k*2*Math.PI/3-Math.PI/2;const px=x+Math.cos(a)*r,py=y+Math.sin(a)*r;k?ctx.lineTo(px,py):ctx.moveTo(px,py)}
    ctx.closePath();
  }
  ctx.fill();
}
function embers(t,n=90,inten=1){
  ctx.save();ctx.globalCompositeOperation='lighter';
  for(let i=0;i<n;i++){
    const sp=80+rnd(i+1)*260,x0=rnd(i+2)*W;
    const y=H+60-((t*sp+rnd(i+3)*(H+120))%(H+120));
    const x=x0+Math.sin(t*1.5+i)*40;
    const r=(2+rnd(i+4)*6)*inten;
    const g=ctx.createRadialGradient(x,y,0,x,y,r*3);
    g.addColorStop(0,'rgba(255,240,180,.95)');g.addColorStop(.35,'rgba(255,170,40,.6)');g.addColorStop(1,'rgba(255,90,0,0)');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r*3,0,7);ctx.fill();
  }
  ctx.restore();
}
function confetti(t,t0,cx,cy,n=160){
  const dt=t-t0;if(dt<0||dt>4)return;
  const cols=[C.cyan,C.orange,C.red,C.green,C.purple,C.gold,'#fff'];
  for(let i=0;i<n;i++){
    const a=rnd(i+40)*Math.PI*2,v=600+rnd(i+41)*1500;
    const x=cx+Math.cos(a)*v*dt*Math.exp(-dt*.9);
    const y=cy+Math.sin(a)*v*dt*Math.exp(-dt*.9)+500*dt*dt;
    ctx.save();ctx.translate(x,y);ctx.rotate(dt*(5+rnd(i)*10)+i);
    ctx.globalAlpha=clamp(1.6-dt*.45);
    ctx.fillStyle=cols[i%cols.length];
    if(i%3==0){star6(0,0,14)}else ctx.fillRect(-11,-6,22*Math.abs(Math.cos(dt*8+i)),12);
    ctx.restore();
  }
}
function flash(t,t0,a=.7){const d=t-t0;if(d>=0&&d<.35){ctx.fillStyle=`rgba(255,248,220,${a*(1-d/.35)})`;ctx.fillRect(0,0,W,H)}}

// ---------- props ----------
function flame(x,y,s,t,i){
  const f=1+.1*Math.sin(t*23+i*3)+.06*Math.sin(t*37+i);
  ctx.save();ctx.globalCompositeOperation='lighter';
  const gl=ctx.createRadialGradient(x,y-20*s,0,x,y-20*s,150*s);
  gl.addColorStop(0,'rgba(255,200,90,.55)');gl.addColorStop(1,'rgba(255,120,0,0)');
  ctx.fillStyle=gl;ctx.beginPath();ctx.arc(x,y-20*s,150*s,0,7);ctx.fill();
  ctx.restore();
  ctx.save();ctx.translate(x,y);ctx.scale(s,s*f);ctx.rotate(.06*Math.sin(t*9+i));
  const g=ctx.createRadialGradient(0,-12,2,0,-20,48);
  g.addColorStop(0,'#fff');g.addColorStop(.3,'#fff3a0');g.addColorStop(.65,'#ffa51e');g.addColorStop(1,'rgba(255,60,0,.0)');
  ctx.fillStyle=g;ctx.beginPath();
  ctx.moveTo(0,-70);ctx.bezierCurveTo(26,-30,30,0,0,8);ctx.bezierCurveTo(-30,0,-26,-30,0,-70);ctx.fill();
  ctx.restore();
}
function hanukkiah(cx,cy,t,litAt,scale=1){
  ctx.save();ctx.translate(cx,cy);ctx.scale(scale,scale);
  const gg=ctx.createLinearGradient(-450,0,450,0);
  gg.addColorStop(0,'#b07a10');gg.addColorStop(.3,'#ffe27a');gg.addColorStop(.5,'#fff6c8');gg.addColorStop(.7,'#ffd34d');gg.addColorStop(1,'#a06a00');
  ctx.strokeStyle=gg;ctx.fillStyle=gg;ctx.lineCap='round';ctx.lineWidth=20;
  ctx.shadowColor='rgba(255,180,0,.6)';ctx.shadowBlur=25;
  for(let k=1;k<=4;k++){ctx.beginPath();ctx.arc(0,0,k*100,0,Math.PI);ctx.stroke()}
  ctx.beginPath();ctx.moveTo(0,-70);ctx.lineTo(0,430);ctx.stroke();
  ctx.beginPath();ctx.moveTo(-170,500);ctx.lineTo(170,500);ctx.lineTo(70,420);ctx.lineTo(-70,420);ctx.closePath();ctx.fill();
  ctx.shadowBlur=0;
  const xs=[-400,-300,-200,-100,0,100,200,300,400];
  const cols=[C.cyan,C.orange,C.red,C.green,'#fff',C.purple,C.cyan,C.orange,C.red];
  // light order: shamash, then right->left
  const order=[4,8,7,6,5,3,2,1,0];
  xs.forEach((x,i)=>{
    const top=i==4?-70:0;
    ctx.fillStyle=gg;rrect(x-30,top-14,60,22,8);ctx.fill();
    ctx.fillStyle=cols[i];rrect(x-15,top-120,30,108,6);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.35)';ctx.fillRect(x-9,top-116,6,100);
    const j=order.indexOf(i),lt=litAt(j);
    if(t>=lt){const p=E.back(P(t,lt,.25));flame(x,top-122,.95*p,t,i)}
  });
  ctx.restore();
}
function dreidel(x,y,s,t,speed=9){
  ctx.save();ctx.translate(x,y);ctx.rotate(.14*Math.sin(t*4));
  const ang=t*speed,q=ang/(Math.PI/2),face=Math.floor(q),ph=q-face;
  const L=['נ','ג','ה','פ'],cols=[C.cyan,C.orange,C.red,C.green];
  // handle
  ctx.fillStyle='#e8eef8';rrect(-s*.08,-s*.95,s*.16,s*.5,s*.05);ctx.fill();
  const wa=s*(1-ph);
  const panel=(x0,w,fi)=>{
    if(w<1)return;
    const c=cols[((fi%4)+4)%4];
    ctx.fillStyle=c;ctx.beginPath();ctx.rect(x0,-s*.5,w,s);ctx.fill();
    ctx.beginPath();ctx.moveTo(x0,s*.5);ctx.lineTo(x0+w,s*.5);
    // bottom point (shared)
    ctx.lineTo(0,s*1.05);ctx.closePath();ctx.globalAlpha=.85;ctx.fill();ctx.globalAlpha=1;
    ctx.save();ctx.translate(x0+w/2,0);ctx.scale(w/s,1);
    ctx.font=`900 ${s*.75}px Rubik`;ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillStyle='#fff';ctx.strokeStyle='rgba(0,0,40,.35)';ctx.lineWidth=s*.06;ctx.strokeText(L[((fi%4)+4)%4],0,s*.02);ctx.fillText(L[((fi%4)+4)%4],0,s*.02);ctx.restore();
  };
  panel(-s/2,wa,face);panel(-s/2+wa,s-wa,face+1);
  ctx.fillStyle='rgba(255,255,255,.25)';ctx.fillRect(-s/2,-s*.5,s,s*.08);
  ctx.restore();
}
function sufganiya(x,y,r,rot){
  ctx.save();ctx.translate(x,y);ctx.rotate(rot);
  const g=ctx.createRadialGradient(-r*.3,-r*.3,r*.1,0,0,r);
  g.addColorStop(0,'#f6c27a');g.addColorStop(.7,'#d98a3a');g.addColorStop(1,'#a85a1c');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,r,0,7);ctx.fill();
  ctx.fillStyle='#fff8f0';ctx.beginPath();ctx.ellipse(0,-r*.15,r*.8,r*.55,0,0,7);ctx.globalAlpha=.85;ctx.fill();ctx.globalAlpha=1;
  ctx.fillStyle='#d61f3c';ctx.beginPath();ctx.ellipse(0,-r*.25,r*.28,r*.18,0,0,7);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.7)';ctx.beginPath();ctx.arc(-r*.08,-r*.3,r*.06,0,7);ctx.fill();
  ctx.restore();
}
function donutRain(t,t0,n=14){
  for(let i=0;i<n;i++){
    const sp=350+rnd(i+70)*350,x=60+rnd(i+71)*(W-120);
    const y=-150+((t-t0)*sp+rnd(i+72)*H*.6)%(H+300)-(rnd(i+73)>.5?0:200);
    sufganiya(x,y,45+rnd(i+74)*35,(t-t0)*(rnd(i+75)-.5)*4);
  }
}
function logoCard(cx,cy,w,p,t){
  if(!logo.complete)return;
  const h=w*logo.height/logo.width;
  ctx.save();ctx.translate(cx,cy);ctx.scale(p,p);ctx.rotate(.02*Math.sin(t*2));
  ctx.shadowColor='rgba(255,210,90,.9)';ctx.shadowBlur=70;
  ctx.fillStyle='#fff';rrect(-w/2-40,-h/2-36,w+80,h+72,60);ctx.fill();
  ctx.shadowBlur=0;
  ctx.lineWidth=10;const gg=ctx.createLinearGradient(-w/2,0,w/2,0);
  gg.addColorStop(0,C.red);gg.addColorStop(.33,C.orange);gg.addColorStop(.66,C.cyan);gg.addColorStop(1,C.green);
  ctx.strokeStyle=gg;ctx.stroke();
  ctx.drawImage(logo,-w/2,-h/2,w,h);
  ctx.restore();
}
function ribbon(txt,y,col,p,i){
  const x=W+20-(E.back(p))*900;
  ctx.save();ctx.translate(x,y);ctx.rotate(-.03);
  ctx.shadowColor='rgba(0,0,0,.4)';ctx.shadowBlur=20;ctx.shadowOffsetY=10;
  ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(-40,-75);ctx.lineTo(1000,-75);ctx.lineTo(1000,75);ctx.lineTo(0,75);ctx.closePath();ctx.fill();
  ctx.shadowColor='transparent';
  ctx.fillStyle='#fff';ctx.font='900 100px Rubik';ctx.textAlign='left';ctx.textBaseline='middle';ctx.direction='rtl';
  ctx.fillText(txt,40,8);
  ctx.restore();
}
function shake(t,hits){
  let a=0;for(const h of hits){const d=t-h;if(d>=0&&d<.4)a+=28*(1-d/.4)}
  return [Math.sin(t*90)*a,Math.cos(t*77)*a];
}

// ---------- story props ----------
function zzz(x,y,t,t0){
  if(t<t0)return;
  for(let i=0;i<4;i++){
    const d=((t-t0)*0.9+i*.35)%1.4;
    ctx.save();ctx.globalAlpha=clamp(1-d/1.4)*clamp((t-t0)*3);
    ctx.translate(x+d*120+Math.sin(d*6)*20,y-d*260);ctx.rotate(-.2);
    ctx.font=`900 ${70+d*60}px Rubik`;ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.lineWidth=10;ctx.strokeStyle=C.navy;ctx.strokeText('Z',0,0);ctx.fillStyle='#bfe9ff';ctx.fillText('Z',0,0);
    ctx.restore();
  }
}
let moonCv=null;
function moon(x,y,r,t){
  if(!moonCv){moonCv=document.createElement('canvas');moonCv.width=moonCv.height=r*4;const m=moonCv.getContext('2d');
    m.translate(r*2,r*2);m.fillStyle='#fff3c4';m.beginPath();m.arc(0,0,r,0,7);m.fill();
    m.shadowBlur=0;m.globalCompositeOperation='destination-out';m.beginPath();m.arc(r*.45,-r*.25,r*.85,0,7);m.fill();}
  ctx.drawImage(moonCv,x-r*2,y-r*2);
}
function tunnel(t,p){
  const cols=[C.cyan,C.orange,C.purple,C.gold,C.red,C.green];
  ctx.save();ctx.translate(W/2,H*.45);
  for(let i=14;i>=0;i--){
    const z=((i+t*3.2)%15)/15, r=40+Math.pow(z,2.2)*1500;
    ctx.save();ctx.rotate(t*(i%2?.8:-.6)+i);
    ctx.globalAlpha=.55*p*(1-z*.3);
    ctx.strokeStyle=cols[i%6];ctx.lineWidth=10+z*50;ctx.setLineDash([r*.5,r*.25]);
    ctx.beginPath();ctx.arc(0,0,r,0,7);ctx.stroke();ctx.restore();
  }
  const g=ctx.createRadialGradient(0,0,0,0,0,300);
  g.addColorStop(0,`rgba(255,255,230,${.9*p})`);g.addColorStop(1,'rgba(255,220,120,0)');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,300,0,7);ctx.fill();
  ctx.restore();
}
function sword(len,col){
  ctx.fillStyle='#dfe7f2';ctx.beginPath();ctx.moveTo(-14,0);ctx.lineTo(14,0);ctx.lineTo(10,-len);ctx.lineTo(0,-len-40);ctx.lineTo(-10,-len);ctx.closePath();ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.6)';ctx.fillRect(-2,-len,4,len);
  ctx.fillStyle=col;rrect(-70,-6,140,26,10);ctx.fill();
  ctx.fillStyle='#7a4a1c';rrect(-13,18,26,110,8);ctx.fill();
  ctx.fillStyle=col;ctx.beginPath();ctx.arc(0,135,20,0,7);ctx.fill();
}
function shield(x,y,s,t,p){
  ctx.save();ctx.translate(x,y);ctx.scale(p,p);
  ctx.save();ctx.rotate(-.7+.05*Math.sin(t*6));ctx.translate(0,180);sword(420,C.gold);ctx.restore();
  ctx.save();ctx.rotate(.7-.05*Math.sin(t*6));ctx.translate(0,180);sword(420,C.gold);ctx.restore();
  ctx.shadowColor='rgba(255,190,40,.9)';ctx.shadowBlur=50;
  const g=ctx.createRadialGradient(-s*.3,-s*.3,10,0,0,s);
  g.addColorStop(0,'#fff1b0');g.addColorStop(.5,'#f2b52a');g.addColorStop(1,'#9c6200');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,s,0,7);ctx.fill();ctx.shadowBlur=0;
  ctx.lineWidth=s*.09;ctx.strokeStyle='#7a4a00';ctx.stroke();
  ctx.fillStyle=C.navy;ctx.beginPath();ctx.arc(0,0,s*.72,0,7);ctx.fill();
  for(let i=0;i<12;i++){const a=i*Math.PI/6;ctx.fillStyle='#ffe27a';ctx.beginPath();ctx.arc(Math.cos(a)*s*.86,Math.sin(a)*s*.86,s*.045,0,7);ctx.fill()}
  ctx.font=`900 ${s*.42}px Rubik`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.direction='rtl';
  ctx.fillStyle='#ffd34d';ctx.fillText('מכבי',0,s*.04);
  ctx.restore();
}
function spears(t,t0){
  const p=E.out(P(t,t0,.6));
  for(let i=0;i<11;i++){
    const x=W+80-((t-t0)*260+i*120)%(W+240), bob=Math.abs(Math.sin(t*6+i))*22;
    ctx.save();ctx.translate(x,H+40-bob-260*p);
    ctx.fillStyle='#8a5a2b';ctx.fillRect(-6,-360,12,360);
    ctx.fillStyle='#e6edf5';ctx.beginPath();ctx.moveTo(-20,-360);ctx.lineTo(20,-360);ctx.lineTo(0,-430);ctx.closePath();ctx.fill();
    ctx.fillStyle=[C.cyan,C.orange,C.red,C.green][i%4];ctx.beginPath();ctx.moveTo(6,-350);ctx.lineTo(70,-330+Math.sin(t*9+i)*10);ctx.lineTo(6,-300);ctx.fill();
    ctx.restore();
  }
}
function rays(x,y,t,a=.25,col='255,220,120'){
  ctx.save();ctx.translate(x,y);ctx.rotate(t*.6);ctx.globalCompositeOperation='lighter';
  for(let i=0;i<14;i++){ctx.rotate(Math.PI*2/14);ctx.fillStyle=`rgba(${col},${a*(i%2?.6:1)})`;
    ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(-60,-900);ctx.lineTo(60,-900);ctx.fill()}
  ctx.restore();
}
function jug(x,y,s,t){
  ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.rotate(.05*Math.sin(t*3));
  const g=ctx.createLinearGradient(-120,0,120,0);
  g.addColorStop(0,'#8a4a1e');g.addColorStop(.4,'#d98a4a');g.addColorStop(.6,'#e8a462');g.addColorStop(1,'#7a3e14');
  ctx.fillStyle=g;
  ctx.beginPath();
  ctx.moveTo(-40,-170);ctx.lineTo(40,-170);ctx.lineTo(35,-120);
  ctx.bezierCurveTo(140,-90,150,80,70,150);ctx.lineTo(-70,150);
  ctx.bezierCurveTo(-150,80,-140,-90,-35,-120);ctx.closePath();ctx.fill();
  ctx.lineWidth=18;ctx.strokeStyle='#b8692a';ctx.beginPath();ctx.moveTo(60,-110);ctx.bezierCurveTo(150,-130,150,-20,95,-10);ctx.stroke();
  ctx.fillStyle='#6a3410';rrect(-48,-190,96,30,10);ctx.fill();
  // seal of the High Priest
  ctx.fillStyle=C.red;ctx.beginPath();ctx.arc(0,-185,30,0,7);ctx.fill();
  ctx.fillStyle='#ffd34d';star6(0,-185,16);
  ctx.strokeStyle='rgba(255,230,160,.6)';ctx.lineWidth=8;
  for(const yy of [-40,40]){ctx.beginPath();ctx.moveTo(-105,yy);ctx.quadraticCurveTo(0,yy+25,105,yy);ctx.stroke()}

}
function sparkles(x,y,t,n=24,R=320){
  ctx.save();ctx.globalCompositeOperation='lighter';
  for(let i=0;i<n;i++){
    const a=rnd(i+300)*7+t*.5,r=R*(.3+rnd(i+301)*.8),tw=Math.abs(Math.sin(t*4+i));
    ctx.fillStyle=`rgba(255,240,170,${tw})`;star6(x+Math.cos(a)*r,y+Math.sin(a)*r,6+tw*14);
  }
  ctx.restore();
}
function templeMenorah(cx,cy,t,litAt){
  // stone arch of the Temple
  ctx.save();
  const sg=ctx.createLinearGradient(0,cy-700,0,cy+600);
  sg.addColorStop(0,'rgba(240,220,170,.28)');sg.addColorStop(1,'rgba(200,170,110,.12)');
  ctx.fillStyle=sg;ctx.beginPath();ctx.moveTo(cx-460,cy+620);ctx.lineTo(cx-460,cy-300);ctx.arc(cx,cy-300,460,Math.PI,0);ctx.lineTo(cx+460,cy+620);
  ctx.lineTo(cx+380,cy+620);ctx.lineTo(cx+380,cy-300);ctx.arc(cx,cy-300,380,0,Math.PI,true);ctx.lineTo(cx-380,cy+620);ctx.closePath();ctx.fill();
  ctx.strokeStyle='rgba(120,90,40,.35)';ctx.lineWidth=4;
  for(let k=0;k<9;k++){const a=Math.PI+k*Math.PI/8;ctx.beginPath();ctx.moveTo(cx+Math.cos(a)*380,cy-300+Math.sin(a)*380);ctx.lineTo(cx+Math.cos(a)*460,cy-300+Math.sin(a)*460);ctx.stroke()}
  ctx.restore();
  ctx.save();ctx.translate(cx,cy);
  const gg=ctx.createLinearGradient(-350,0,350,0);
  gg.addColorStop(0,'#b07a10');gg.addColorStop(.3,'#ffe27a');gg.addColorStop(.5,'#fff6c8');gg.addColorStop(.7,'#ffd34d');gg.addColorStop(1,'#a06a00');
  ctx.strokeStyle=gg;ctx.fillStyle=gg;ctx.lineCap='round';ctx.lineWidth=26;ctx.shadowColor='rgba(255,180,0,.7)';ctx.shadowBlur=30;
  for(let k=1;k<=3;k++){ctx.beginPath();ctx.arc(0,0,k*120,0,Math.PI);ctx.stroke()}
  ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(0,480);ctx.stroke();
  ctx.beginPath();ctx.moveTo(-200,560);ctx.lineTo(200,560);ctx.lineTo(150,470);ctx.lineTo(-150,470);ctx.closePath();ctx.fill();
  ctx.shadowBlur=0;
  const xs=[-360,-240,-120,0,120,240,360],order=[3,2,4,1,5,0,6];
  xs.forEach((x,i)=>{
    ctx.fillStyle=gg;ctx.beginPath();ctx.ellipse(x,-10,48,22,0,0,7);ctx.fill();
    const lt=litAt(order.indexOf(i));
    if(t>=lt)flame(x,-22,1.15*E.back(P(t,lt,.25)),t,i+20);
  });
  ctx.restore();
}

}
